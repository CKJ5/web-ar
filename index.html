```html
<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  />

  <title>EduHero AR</title>

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

  <!-- MindAR Image Tracking -->
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: Arial, sans-serif;
      background: #000;
    }

    a-scene {
      width: 100%;
      height: 100%;
    }

    /* 开始页面 */
    #startScreen {
      position: fixed;
      inset: 0;
      z-index: 9999;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;

      padding: 30px;
      text-align: center;

      background:
        linear-gradient(
          135deg,
          #3403b4,
          #fc0c97
        );

      color: white;
    }

    #startScreen.hidden {
      display: none;
    }

    #startScreen h1 {
      margin: 0 0 12px;
      font-size: 32px;
    }

    #startScreen p {
      margin: 0 0 28px;
      max-width: 320px;
      line-height: 1.5;
      font-size: 16px;
      opacity: 0.95;
    }

    #startButton {
      border: none;
      border-radius: 999px;

      padding: 16px 34px;

      font-size: 18px;
      font-weight: bold;

      background: white;
      color: #fc0c97;

      cursor: pointer;
    }

    #startButton:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    /* 状态提示 */
    #status {
      margin-top: 20px;
      max-width: 340px;

      font-size: 14px;
      line-height: 1.5;

      color: white;
    }

    /* AR 上方提示 */
    #scanHint {
      position: fixed;

      top: 24px;
      left: 50%;
      transform: translateX(-50%);

      z-index: 9998;

      display: none;

      padding: 12px 20px;

      border-radius: 999px;

      background: rgba(0, 0, 0, 0.7);
      color: white;

      font-size: 14px;
      text-align: center;

      pointer-events: none;
    }

    /* Error box */
    #errorBox {
      display: none;

      margin-top: 20px;
      padding: 15px;

      max-width: 360px;

      border-radius: 12px;

      background: rgba(0, 0, 0, 0.35);

      font-size: 14px;
      line-height: 1.5;

      text-align: left;
    }

    #retryButton {
      display: none;

      margin-top: 15px;

      border: 1px solid white;
      border-radius: 999px;

      padding: 11px 24px;

      background: transparent;
      color: white;

      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>

<body>

  <!-- =====================================================
       START SCREEN
  ====================================================== -->

  <div id="startScreen">

    <h1>EduHero AR</h1>

    <p>
      点击开始后，请允许使用相机。
      然后把镜头对准指定的课本图片。
    </p>

    <button id="startButton">
      开始扫描
    </button>

    <div id="status">
      准备开始
    </div>

    <div id="errorBox"></div>

    <button id="retryButton">
      再试一次
    </button>

  </div>


  <!-- =====================================================
       SCAN HINT
  ====================================================== -->

  <div id="scanHint">
    请把镜头对准课本图片
  </div>


  <!-- =====================================================
       MINDAR SCENE
  ====================================================== -->

  <a-scene

    mindar-image="
      imageTargetSrc: ./assets/targets.mind;
      autoStart: false;
      filterMinCF: 0.001;
      filterBeta: 0.01;
      missTolerance: 5;
      warmupTolerance: 5;
    "

    color-space="sRGB"

    renderer="
      colorManagement: true;
      physicallyCorrectLights: true;
      antialias: true;
      alpha: true;
    "

    vr-mode-ui="enabled: false"

    device-orientation-permission-ui="enabled: false"

    embedded

  >


    <!-- ===================================================
         ASSETS
    ==================================================== -->

    <a-assets timeout="30000">

      <video

        id="teacherVideo"

        src="./assets/teacher.mp4"

        preload="auto"

        loop

        muted

        playsinline

        webkit-playsinline

      ></video>

    </a-assets>


    <!-- ===================================================
         CAMERA
    ==================================================== -->

    <a-camera

      position="0 0 0"

      look-controls="enabled: false"

    ></a-camera>


    <!-- ===================================================
         TARGET
    ==================================================== -->

    <a-entity

      id="target"

      mindar-image-target="targetIndex: 0"

    >

      <a-video

        id="arVideo"

        src="#teacherVideo"

        width="1"

        height="0.5625"

        position="0 0 0.01"

        rotation="0 0 0"

      ></a-video>

    </a-entity>


  </a-scene>


  <!-- =====================================================
       JAVASCRIPT
  ====================================================== -->

  <script>

    document.addEventListener("DOMContentLoaded", () => {

      const sceneEl =
        document.querySelector("a-scene");

      const startScreen =
        document.getElementById("startScreen");

      const startButton =
        document.getElementById("startButton");

      const retryButton =
        document.getElementById("retryButton");

      const status =
        document.getElementById("status");

      const errorBox =
        document.getElementById("errorBox");

      const scanHint =
        document.getElementById("scanHint");

      const target =
        document.getElementById("target");

      const teacherVideo =
        document.getElementById("teacherVideo");


      let arSystem = null;

      let starting = false;


      /* ===================================================
         WAIT UNTIL A-FRAME IS READY
      ==================================================== */

      sceneEl.addEventListener("loaded", () => {

        arSystem =
          sceneEl.systems["mindar-image-system"];

        console.log(
          "MindAR system loaded:",
          arSystem
        );

      });


      /* ===================================================
         CHECK VIDEO FILE
      ==================================================== */

      teacherVideo.addEventListener(
        "loadeddata",
        () => {

          console.log(
            "teacher.mp4 loaded successfully"
          );

        }
      );


      teacherVideo.addEventListener(
        "error",
        () => {

          console.error(
            "teacher.mp4 could not be loaded"
          );

        }
      );


      /* ===================================================
         REQUEST CAMERA PERMISSION
      ==================================================== */

      async function requestCameraPermission() {

        if (
          !navigator.mediaDevices ||
          !navigator.mediaDevices.getUserMedia
        ) {

          throw new Error(
            "CAMERA_NOT_SUPPORTED"
          );

        }


        /*
          Request camera directly from user's button click.

          Once permission is granted,
          immediately stop this temporary stream.

          MindAR will open the camera again afterward.
        */

        const stream =
          await navigator.mediaDevices.getUserMedia({
            video: {
              facingMode: {
                ideal: "environment"
              }
            },
            audio: false
          });


        stream
          .getTracks()
          .forEach(track => track.stop());


        return true;

      }


      /* ===================================================
         START AR
      ==================================================== */

      async function startAR() {

        if (starting) {
          return;
        }


        starting = true;

        startButton.disabled = true;

        retryButton.style.display = "none";

        errorBox.style.display = "none";

        errorBox.innerHTML = "";


        try {

          /* -----------------------------------------------
             HTTPS CHECK
          ------------------------------------------------ */

          if (!window.isSecureContext) {

            throw new Error(
              "NOT_SECURE"
            );

          }


          /* -----------------------------------------------
             CAMERA PERMISSION
          ------------------------------------------------ */

          status.innerText =
            "正在请求相机权限...";


          await requestCameraPermission();


          console.log(
            "Camera permission granted"
          );


          status.innerText =
            "正在启动 AR...";


          /* -----------------------------------------------
             WAIT FOR MINDAR SYSTEM
          ------------------------------------------------ */

          if (!arSystem) {

            await new Promise(resolve => {

              const interval =
                setInterval(() => {

                  arSystem =
                    sceneEl.systems[
                      "mindar-image-system"
                    ];


                  if (arSystem) {

                    clearInterval(interval);

                    resolve();

                  }

                }, 100);

            });

          }


          /* -----------------------------------------------
             START MINDAR
          ------------------------------------------------ */

          await arSystem.start();


          console.log(
            "MindAR started"
          );

        }

        catch (error) {

          console.error(
            "AR START ERROR:",
            error
          );


          starting = false;

          startButton.disabled = false;


          showCameraError(error);

        }

      }


      /* ===================================================
         ERROR HANDLING
      ==================================================== */

      function showCameraError(error) {

        status.innerText =
          "无法开启相机";


        errorBox.style.display =
          "block";


        retryButton.style.display =
          "inline-block";


        if (
          error.name === "NotAllowedError"
        ) {

          errorBox.innerHTML = `
            <strong>相机权限被拒绝或取消。</strong>
            <br><br>

            请检查：
            <br>
            1. Chrome 是否允许 Camera
            <br>
            2. 网站 Camera Permission 是否为 Allow
            <br>
            3. 是否有 Floating Bubble / Overlay
            <br>
            4. 是否从 Chrome / Safari 直接打开网页
            <br><br>

            如果看到：
            <br>
            <em>
            "This site can't ask for your permission"
            </em>
            <br>
            请关闭其他 App 的浮动窗口后再试。
          `;

        }

        else if (
          error.name === "NotFoundError"
        ) {

          errorBox.innerHTML = `
            找不到可使用的相机。
          `;

        }

        else if (
          error.name === "NotReadableError"
        ) {

          errorBox.innerHTML = `
            相机目前正在被其他 App 使用。
            <br><br>
            请关闭其他使用相机的 App 后再试。
          `;

        }

        else if (
          error.message === "NOT_SECURE"
        ) {

          errorBox.innerHTML = `
            Camera 需要 HTTPS。
            <br><br>
            请使用：
            <br>
            https://web-ar-vercel.vercel.app/
          `;

        }

        else if (
          error.message ===
          "CAMERA_NOT_SUPPORTED"
        ) {

          errorBox.innerHTML = `
            当前浏览器不支持 Camera API。
            <br><br>
            请使用最新版 Chrome 或 Safari。
          `;

        }

        else {

          errorBox.innerHTML = `
            AR 启动失败。
            <br><br>
            ${error.name || "Error"}
            <br>
            ${error.message || ""}
          `;

        }

      }


      /* ===================================================
         MINDAR READY
      ==================================================== */

      sceneEl.addEventListener(
        "arReady",
        () => {

          console.log(
            "MindAR AR READY"
          );


          startScreen.classList.add(
            "hidden"
          );


          scanHint.style.display =
            "block";


          starting = false;

        }
      );


      /* ===================================================
         MINDAR ERROR
      ==================================================== */

      sceneEl.addEventListener(
        "arError",
        event => {

          console.error(
            "MindAR arError:",
            event
          );


          starting = false;

          startButton.disabled = false;

          startScreen.classList.remove(
            "hidden"
          );


          showCameraError({
            name: "MindARError",
            message:
              "MindAR 无法启动 Camera"
          });

        }
      );


      /* ===================================================
         TARGET FOUND
      ==================================================== */

      target.addEventListener(
        "targetFound",
        async () => {

          console.log(
            "TARGET FOUND"
          );


          scanHint.innerText =
            "识别成功";


          try {

            teacherVideo.currentTime = 0;

            await teacherVideo.play();

          }

          catch (error) {

            console.warn(
              "Video autoplay failed:",
              error
            );

          }

        }
      );


      /* ===================================================
         TARGET LOST
      ==================================================== */

      target.addEventListener(
        "targetLost",
        () => {

          console.log(
            "TARGET LOST"
          );


          teacherVideo.pause();


          scanHint.innerText =
            "请把镜头对准课本图片";

        }
      );


      /* ===================================================
         BUTTONS
      ==================================================== */

      startButton.addEventListener(
        "click",
        startAR
      );


      retryButton.addEventListener(
        "click",
        startAR
      );

    });

  </script>

</body>
</html>
```
